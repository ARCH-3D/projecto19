<script>
let hero = document.getElementById("hero-image");
const heroWrapper = document.querySelector(".hero"); // Necessário para detetar os toques

const imagens = [
    "img/hero/hero1.webp", "img/hero/hero1b.webp", "img/hero/hero2.webp","img/hero/hero3.webp",
    "img/hero/hero4.webp","img/hero/hero5.webp","img/hero/hero6.webp",
    "img/hero/hero7.webp","img/hero/hero8.webp","img/hero/hero9.webp",
    "img/hero/hero10.webp","img/hero/hero11.webp","img/hero/hero12.webp",
    "img/hero/hero13.webp","img/hero/hero14.webp","img/hero/hero15.webp",
    "img/hero/hero16.webp","img/hero/hero17.webp","img/hero/hero18.webp",
    "img/hero/hero19.webp","img/hero/hero20.webp","img/hero/hero21.webp",
    "img/hero/hero22.webp","img/hero/hero23.webp","img/hero/hero24.webp",
    "img/hero/hero25.webp","img/hero/hero26.webp"
];

// 1. MAPEAMENTO DE LINKS DOS PROJETOS
// Este array tem de ter exatamente 26 links (um para cada imagem acima).
// Substitua "projetos.html" pelo URL do projeto correto, ex: "projetos.html?id=nome-do-projeto"
const linksProjetos = [
    "projetos.html?p=projeto168", "projetos.html?p=projeto168", "projetos.html?p=projeto146", "projetos.html?p=projeto85", 
    "projetos.html?p=projeto181", "projetos.html?p=projeto45", "projetos.html?p=projeto7", 
    "projetos.html?p=projeto156", "projetos.html?p=projeto18", "projetos.html?p=projeto158", 
    "projetos.html?p=projeto98", "projetos.html?p=projeto176", "projetos.html?p=projeto187",
    "projetos.html?p=projeto56", "projetos.html?p=projeto168", "projetos.html?p=projeto146",
    "projetos.html?p=projeto85", "projetos.html?p=projeto181", "projetos.html?p=projeto45",
    "projetos.html?p=projeto7", "projetos.html?p=projeto156", "projetos.html?p=projeto18",
    "projetos.html?p=projeto158", "projetos.html?p=projeto98", "projetos.html?p=projeto176",
    "projetos.html?p=projeto187", "projetos.html?p=projeto56"
];

let indice = 0;
let isTransitioning = false; // Impede trocas simultâneas
let gestoHero = null;
let timerId;
let ignorarCliqueHeroAte = 0;
const heroSlideReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
// Conserva apenas a fotografia atual e as duas vizinhas já preparadas.
const cacheImagensHero = new Map();

function criarImagemHero(novoIndice) {
    const destino = ((novoIndice % imagens.length) + imagens.length) % imagens.length;
    const src = imagens[destino];
    const existente = cacheImagensHero.get(destino);
    if (existente && existente.src === src && !existente.descartada && existente.estado !== "falhou") return existente;
    if (existente) existente.descartada = true;

    const elemento = destino === indice ? hero : new Image();
    if (elemento !== hero) {
        elemento.className = "hero-image";
        elemento.alt = hero.alt;
        elemento.decoding = "async";
        elemento.setAttribute("aria-hidden", "true");
        elemento.style.pointerEvents = "none";
        elemento.style.transition = "none";
        elemento.style.transform = "translateX(0)";
    }
    const imagem = { elemento, destino, src, estado: "a-carregar", descartada: false, pronta: null };
    let aoCarregar, aoFalhar;
    imagem.pronta = new Promise((resolve, reject) => {
        aoCarregar = resolve;
        aoFalhar = () => reject(new Error("Falha ao carregar a imagem: " + src));
        elemento.addEventListener("load", aoCarregar);
        elemento.addEventListener("error", aoFalhar);
        if (elemento.getAttribute("src") !== src) elemento.src = src;
        else if (elemento.complete) {
            if (elemento.naturalWidth) resolve();
            else aoFalhar();
        }
    }).then(async () => {
        if (imagem.descartada) throw new Error("Preparação de imagem descartada.");
        if (elemento.decode) await elemento.decode();
        if (imagem.descartada) throw new Error("Preparação de imagem descartada.");
        imagem.estado = "pronta";
    }).catch(error => {
        imagem.estado = "falhou";
        throw error;
    }).finally(() => {
        elemento.removeEventListener("load", aoCarregar);
        elemento.removeEventListener("error", aoFalhar);
    });
    imagem.pronta.catch(() => {});
    cacheImagensHero.set(destino, imagem);
    return imagem;
}

function preloadImagensHero() {
    const vizinhas = [indice, (indice + 1) % imagens.length, (indice - 1 + imagens.length) % imagens.length];
    cacheImagensHero.forEach((imagem, destino) => {
        if (!vizinhas.includes(destino) || imagem.src !== imagens[destino]) {
            imagem.descartada = true;
            cacheImagensHero.delete(destino);
        }
    });
    vizinhas.forEach(criarImagemHero);
}
preloadImagensHero();

function animarHero(elementos, aplicarDestino, duracao = 350, curva = "cubic-bezier(.22,.61,.36,1)") {
    if (heroSlideReducedMotion.matches) {
        elementos.forEach(elemento => elemento.style.transition = "none");
        aplicarDestino();
        return Promise.resolve();
    }
    elementos.forEach(elemento => elemento.classList.add("is-sliding"));
    void heroWrapper.offsetWidth;
    return new Promise(resolve => {
        let timeout;
        const alvo = elementos[0];
        function terminar(event) {
            if (event && (event.target !== alvo || event.propertyName !== "transform")) return;
            clearTimeout(timeout);
            alvo.removeEventListener("transitionend", terminar);
            resolve();
        }
        alvo.addEventListener("transitionend", terminar);
        elementos.forEach(elemento => elemento.style.transition = "transform " + duracao + "ms " + curva);
        aplicarDestino();
        timeout = setTimeout(terminar, duracao + 100);
    });
}

function ativarImagemHero(imagem) {
    const seguinte = imagem.elemento;
    hero.removeAttribute("id");
    hero.setAttribute("aria-hidden", "true");
    hero.style.pointerEvents = "none";
    hero.style.transition = "none";
    hero.style.transform = "translateX(0)";
    hero.classList.remove("is-sliding");
    hero.remove();
    seguinte.style.transition = "none";
    seguinte.style.transform = "translateX(0)";
    seguinte.style.removeProperty("pointer-events");
    seguinte.removeAttribute("aria-hidden");
    seguinte.classList.remove("is-sliding");
    seguinte.id = "hero-image";
    hero = seguinte;
    indice = imagem.destino;
    void seguinte.offsetWidth;
    seguinte.style.removeProperty("transition");
    preloadImagensHero();
}

// Usa o mesmo deslizar nas trocas automáticas e nas setas do computador.
async function irParaImagem(novoIndice) {
    if (isTransitioning || gestoHero) return;
    const destino = ((novoIndice % imagens.length) + imagens.length) % imagens.length;
    if (destino === indice) return;
    const direcao = novoIndice > indice ? 1 : -1;
    isTransitioning = true;
    const anterior = hero;
    const seguinte = criarImagemHero(destino);
    seguinte.elemento.style.transition = "none";
    seguinte.elemento.classList.remove("is-sliding");
    seguinte.elemento.style.transform = "translateX(" + (direcao * 100) + "%)";
    try {
        await seguinte.pronta;
        anterior.after(seguinte.elemento);
        await animarHero([anterior, seguinte.elemento], () => {
            anterior.style.transform = "translateX(" + (-direcao * 100) + "%)";
            seguinte.elemento.style.transform = "translateX(0)";
        });
        ativarImagemHero(seguinte);
    } catch (error) {
        seguinte.elemento.remove();
        anterior.classList.remove("is-sliding");
        anterior.style.removeProperty("transform");
        anterior.style.removeProperty("transition");
        console.warn(error.message);
    } finally {
        isTransitioning = false;
    }
}

// Função que arranca o modo automático
function iniciarTimer() {
    clearInterval(timerId); // Limpa o timer anterior (importante para quando se desliza o dedo)
    timerId = setInterval(() => {
        irParaImagem(indice + 1);
    }, 5000);
}
iniciarTimer(); // Arranca o timer inicial

// SETAS FIXAS NO COMPUTADOR — o centro da imagem continua a abrir o projeto
const heroNavButtons = heroWrapper.querySelectorAll(".hero-nav");

heroNavButtons.forEach(button => {
    const direcao = button.classList.contains("hero-nav--prev") ? -1 : 1;

    button.addEventListener("click", event => {
        event.stopPropagation();
        irParaImagem(indice + direcao);
        iniciarTimer();
    });
});

// 2. ABRIR PROJETO AO CLICAR NA IMAGEM
heroWrapper.addEventListener("click", event => {
    if (event.target !== hero || isTransitioning || gestoHero || performance.now() < ignorarCliqueHeroAte) return;
    const linkDestino = linksProjetos[indice];
    if (linkDestino && linkDestino !== "") {
        window.location.href = linkDestino;
    }
});

// 3. DESLIZE TÁTIL: a imagem acompanha o dedo, com avanço ou regresso ao largar.
function limparGestoHero(gesto) {
    if (gestoHero !== gesto) return;
    gestoHero = null;
    [gesto.anterior, gesto.seguinte].forEach(imagem => {
        if (imagem && imagem.elemento !== hero) {
            imagem.elemento.remove();
            imagem.elemento.style.transition = "none";
            imagem.elemento.style.transform = "translateX(0)";
            imagem.elemento.classList.remove("is-sliding");
        }
    });
    hero.style.transition = "none";
    hero.style.transform = "translateX(0)";
    hero.classList.remove("is-sliding");
    void hero.offsetWidth;
    hero.style.removeProperty("transition");
    isTransitioning = false;
    if (gesto.eixo === "x") ignorarCliqueHeroAte = performance.now() + 500;
    preloadImagensHero();
    iniciarTimer();
}

function cancelarGestoHero() {
    if (gestoHero) limparGestoHero(gestoHero);
}

function moverGestoHero(gesto, toque) {
    const dx = toque.clientX - gesto.inicioX;
    const dy = toque.clientY - gesto.inicioY;
    if (!gesto.eixo) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 10) return false;
        gesto.eixo = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
        if (gesto.eixo === "x") {
            const anterior = criarImagemHero(indice - 1);
            const seguinte = criarImagemHero(indice + 1);
            // Só entram no gesto fotografias que já terminaram a descodificação.
            // Uma preparação tardia fica disponível para o gesto seguinte, sem saltos.
            gesto.anterior = anterior.estado === "pronta" ? anterior : null;
            gesto.seguinte = seguinte.estado === "pronta" ? seguinte : null;
            const vizinhas = [gesto.anterior, gesto.seguinte].filter(Boolean).map(imagem => imagem.elemento);
            [hero, ...vizinhas].forEach(elemento => {
                elemento.style.transition = "none";
                elemento.classList.add("is-sliding");
            });
            hero.after(...vizinhas);
        }
    }
    if (gesto.eixo !== "x") return false;
    gesto.dx = Math.max(-gesto.largura, Math.min(gesto.largura, dx));
    const destino = gesto.dx < 0 ? gesto.seguinte : gesto.anterior;
    // Em rede lenta, mantém a fotografia atual a cobrir o enquadramento.
    gesto.deslocamento = destino ? gesto.dx : 0;
    hero.style.transform = "translateX(" + gesto.deslocamento + "px)";
    if (gesto.anterior) gesto.anterior.elemento.style.transform = "translateX(calc(-100% + " + gesto.deslocamento + "px))";
    if (gesto.seguinte) gesto.seguinte.elemento.style.transform = "translateX(calc(100% + " + gesto.deslocamento + "px))";
    ignorarCliqueHeroAte = performance.now() + 500;
    return true;
}

async function concluirGestoHero(gesto) {
    const direcao = gesto.dx < 0 ? 1 : -1;
    const destino = direcao === 1 ? gesto.seguinte : gesto.anterior;
    const confirmar = destino && Math.abs(gesto.dx) > gesto.largura * .15;
    if (gestoHero !== gesto) return;
    try {
        // Nunca deixa um gesto parado à espera de carregamento ou descodificação.
        if (!gesto.deslocamento) return;
        if (confirmar) {
            await animarHero([hero, destino.elemento], () => {
                hero.style.transform = "translateX(" + (-direcao * 100) + "%)";
                destino.elemento.style.transform = "translateX(0)";
            }, 250, "ease-out");
            if (gestoHero !== gesto) return;
            ativarImagemHero(destino);
        } else {
            const vizinhas = [gesto.anterior, gesto.seguinte].filter(Boolean).map(imagem => imagem.elemento);
            await animarHero([hero, ...vizinhas], () => {
                hero.style.transform = "translateX(0)";
                if (gesto.anterior) gesto.anterior.elemento.style.transform = "translateX(-100%)";
                if (gesto.seguinte) gesto.seguinte.elemento.style.transform = "translateX(100%)";
            }, 300, "ease");
        }
    } finally {
        limparGestoHero(gesto);
    }
}

heroWrapper.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) {
        if (gestoHero) ignorarCliqueHeroAte = performance.now() + 500;
        cancelarGestoHero();
        return;
    }
    if (isTransitioning || gestoHero || event.target.closest("button, a")) return;
    const toque = event.touches[0];
    gestoHero = {
        identificador: toque.identifier,
        inicioX: toque.clientX,
        inicioY: toque.clientY,
        largura: heroWrapper.clientWidth,
        eixo: null,
        dx: 0,
        deslocamento: 0,
        aConcluir: false,
        anterior: null,
        seguinte: null
    };
    clearInterval(timerId);
}, { passive: true });

heroWrapper.addEventListener("touchmove", event => {
    const gesto = gestoHero;
    if (!gesto || gesto.aConcluir) return;
    if (event.touches.length !== 1) {
        ignorarCliqueHeroAte = performance.now() + 500;
        cancelarGestoHero();
        return;
    }
    const toque = Array.from(event.touches).find(item => item.identifier === gesto.identificador);
    if (!toque) { cancelarGestoHero(); return; }
    if (moverGestoHero(gesto, toque) && event.cancelable) event.preventDefault();
}, { passive: false });

heroWrapper.addEventListener("touchend", event => {
    const gesto = gestoHero;
    if (!gesto || gesto.aConcluir) return;
    const toque = Array.from(event.changedTouches).find(item => item.identifier === gesto.identificador);
    if (!toque || event.touches.length) { cancelarGestoHero(); return; }
    if (!moverGestoHero(gesto, toque)) {
        if (gesto.eixo === "y") ignorarCliqueHeroAte = performance.now() + 500;
        limparGestoHero(gesto);
        return;
    }
    gesto.aConcluir = true;
    isTransitioning = true;
    void concluirGestoHero(gesto);
}, { passive: true });

heroWrapper.addEventListener("touchcancel", cancelarGestoHero, { passive: true });
window.addEventListener("resize", cancelarGestoHero);
window.addEventListener("pagehide", cancelarGestoHero);
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") cancelarGestoHero();
});

// WIDGET DE CONTACTO
const contactWidget=document.querySelector(".contact-widget");
const contactButton=document.querySelector(".contact-trigger");

contactButton.addEventListener("click",function(e){
    e.stopPropagation();
    contactWidget.classList.toggle("active");
});

contactWidget.addEventListener("click",function(e){
    e.stopPropagation();
});

// MENU MOBILE
const menu=document.getElementById("menu");
const menuToggle=document.querySelector(".menu-toggle");

function toggleMenu(){
    menu.classList.toggle("active");
}

document.querySelectorAll("#menu a").forEach(link=>{
    link.addEventListener("click",()=>{
        menu.classList.remove("active");
    });
});

document.addEventListener("pointerdown", function(e){
    if(menu.classList.contains("active") && !menu.contains(e.target) && !menuToggle.contains(e.target)){
        menu.classList.remove("active");
    }
    if(contactWidget.classList.contains("active") && !contactWidget.contains(e.target)){
        contactWidget.classList.remove("active");
    }
});

window.addEventListener("scroll",()=>{
    menu.classList.remove("active");
    contactWidget.classList.remove("active");
},{passive:true});

// ALTURA DO HERO — proteção estendida para todos os browsers no iOS/iPadOS (Safari, Chrome, Edge)
const heroSection = document.querySelector(".hero");
// Deteta iPhone, iPod, iPad (incluindo as versões iPadOS que se identificam como Mac)
const isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let currentWidth = window.innerWidth;

function getHeroViewportHeight() {
    if (window.visualViewport && window.visualViewport.height) {
        return Math.round(window.visualViewport.height);
    }
    return Math.round(window.innerHeight);
}

function setHeroHeight() {
    if (!heroSection) return;

    // Apenas dispositivos Apple (iOS/iPadOS) recebem este ajuste cirúrgico.
    // Congela a altura em píxeis para que o 100dvh não cause zoom na imagem durante o scroll.
    // Nos restantes dispositivos (ex: Android, PC) mantém-se o comportamento CSS nativo.
    if (isIOS) {
        heroSection.style.height = `${getHeroViewportHeight()}px`;
    }
}

// Primeiro cálculo
setHeroHeight();

// Recalcula apenas quando a largura muda (ex: rodar telemóvel portrait/landscape).
// Mantém a proteção existente contra saltos durante o scroll.
window.addEventListener("resize", () => {
    if (window.innerWidth !== currentWidth) {
        currentWidth = window.innerWidth;
        setHeroHeight();
    }
});

// Ao voltar para o browser depois de o sistema suspender a página,
// o viewport pode ter sido recalculado entretanto.
window.addEventListener("pageshow", () => {
    if (!isIOS) return;

    requestAnimationFrame(() => {
        setHeroHeight();
        setTimeout(setHeroHeight, 100);
        setTimeout(setHeroHeight, 300);
        setTimeout(setHeroHeight, 600);
    });
});

document.addEventListener("visibilitychange", () => {
    if (!isIOS || document.visibilityState !== "visible") return;

    requestAnimationFrame(() => {
        setHeroHeight();
        setTimeout(setHeroHeight, 100);
        setTimeout(setHeroHeight, 300);
        setTimeout(setHeroHeight, 600);
    });
});

</script>
