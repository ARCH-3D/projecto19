<!-- JAVASCRIPT -->
<script>
const hero = document.getElementById("hero-image");
const heroWrapper = document.querySelector(".hero"); // Necessário para detetar os toques

const imagens = [
    "img/hero/hero1.webp","img/hero/hero2.webp","img/hero/hero3.webp",
    "img/hero/hero4.webp","img/hero/hero5.webp","img/hero/hero6.webp",
    "img/hero/hero7.webp","img/hero/hero8.webp","img/hero/hero9.webp",
    "img/hero/hero10.webp","img/hero/hero11.webp","img/hero/hero12.webp",
    "img/hero/hero13.webp","img/hero/hero14.webp","img/hero/hero15.webp",
    "img/hero/hero16.webp","img/hero/hero17.webp","img/hero/hero18.webp",
    "img/hero/hero19.webp","img/hero/hero20.webp","img/hero/hero21.webp",
    "img/hero/hero22.webp","img/hero/hero23.webp","img/hero/hero24.webp",
    "img/hero/hero25.webp","img/hero/hero26.webp"
];

// 1. MAPEAMENTO DE LINKS DOS PROJETOS
// Este array tem de ter exatamente 26 links (um para cada imagem acima).
// Substitua "projetos.html" pelo URL do projeto correto, ex: "projetos.html?id=nome-do-projeto"
const linksProjetos = [
    "projetos.html?p=projeto168", "projetos.html?p=projeto146", "projetos.html?p=projeto85", 
    "projetos.html?p=projeto181", "projetos.html?p=projeto45", "projetos.html?p=projeto07", 
    "projetos.html?p=projeto156", "projetos.html?p=projeto18", "projetos.html?p=projeto158", 
    "projetos.html?p=projeto98", "projetos.html?p=projeto176", "projetos.html?p=projeto187",
    "projetos.html?p=projeto56", "projetos.html?p=projeto168", "projetos.html?p=projeto146",
    "projetos.html?p=projeto85", "projetos.html?p=projeto181", "projetos.html?p=projeto45",
    "projetos.html?p=projeto07", "projetos.html?p=projeto156", "projetos.html?p=projeto18",
    "projetos.html?p=projeto158", "projetos.html?p=projeto98", "projetos.html?p=projeto176",
    "projetos.html?p=projeto187", "projetos.html?p=projeto56"
];

let indice = 0;
let isTransitioning = false; // Impede bugs se o utilizador deslizar muito rápido
let timerId;
let preload = new Image();
preload.src = imagens[1];

hero.style.cursor = "pointer"; // Transforma o rato numa "mão" indicando que é clicável

// Função que gere a troca de imagens com segurança
function irParaImagem(novoIndice) {
    if (isTransitioning) return;
    isTransitioning = true;
    
    indice = novoIndice;
    if (indice < 0) indice = imagens.length - 1;
    if (indice >= imagens.length) indice = 0;

    hero.style.opacity = 0;
    setTimeout(() => {
        hero.src = imagens[indice];
        hero.onload = () => {
            hero.style.opacity = 1;
            isTransitioning = false;
            preload = new Image();
            preload.src = imagens[(indice + 1) % imagens.length];
        };
        hero.onerror = () => {
            hero.style.opacity = 1;
            isTransitioning = false;
            console.warn("Falha ao carregar a imagem: " + imagens[indice]);
        };
    }, 400);
}

// Função que arranca o modo automático
function iniciarTimer() {
    clearInterval(timerId); // Limpa o timer anterior (importante para quando se desliza o dedo)
    timerId = setInterval(() => {
        irParaImagem(indice + 1);
    }, 5000);
}
iniciarTimer(); // Arranca o timer inicial

// 2. ABRIR PROJETO AO CLICAR NA IMAGEM
hero.addEventListener("click", () => {
    const linkDestino = linksProjetos[indice];
    if (linkDestino && linkDestino !== "") {
        window.location.href = linkDestino;
    }
});

// 3. CONTROLOS DE DESLIZE (SWIPE) PARA DISPOSITIVOS MÓVEIS
let touchStartX = 0;
let touchStartY = 0;

heroWrapper.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

heroWrapper.addEventListener('touchend', e => {
    let touchEndX = e.changedTouches[0].screenX;
    let touchEndY = e.changedTouches[0].screenY;
    
    let deltaX = touchEndX - touchStartX;
    let deltaY = touchEndY - touchStartY;
    
    // Verifica se o movimento foi predominantemente horizontal e superior a 50px
    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
        if (deltaX < 0) {
            irParaImagem(indice + 1); // Deslize para a esquerda -> Próxima imagem
        } else {
            irParaImagem(indice - 1); // Deslize para a direita -> Imagem anterior
        }
        iniciarTimer(); // Reinicia a contagem dos 5 segundos
    }
}, { passive: true });

// WIDGET DE CONTACTO
const contactWidget=document.querySelector(".contact-widget");
const contactButton=document.querySelector(".contact-trigger");

contactButton.addEventListener("click",function(e){
    e.stopPropagation();
    contactWidget.classList.toggle("active");
});

contactWidget.addEventListener("click",function(e){
    e.stopPropagation();
});

// MENU MOBILE
const menu=document.getElementById("menu");
const menuToggle=document.querySelector(".menu-toggle");

function toggleMenu(){
    menu.classList.toggle("active");
}

document.querySelectorAll("#menu a").forEach(link=>{
    link.addEventListener("click",()=>{
        menu.classList.remove("active");
    });
});

document.addEventListener("pointerdown", function(e){
    if(menu.classList.contains("active") && !menu.contains(e.target) && !menuToggle.contains(e.target)){
        menu.classList.remove("active");
    }
    if(contactWidget.classList.contains("active") && !contactWidget.contains(e.target)){
        contactWidget.classList.remove("active");
    }
});

window.addEventListener("scroll",()=>{
    menu.classList.remove("active");
    contactWidget.classList.remove("active");
},{passive:true});

// ALTURA FIXA DO HERO NO MOBILE (Correção Cross-browser)
const heroSection = document.querySelector(".hero");
let currentWidth = window.innerWidth;

// 1. Função que aplica a altura estática em píxeis
function setHeroHeight() {
    if (heroSection) {
        heroSection.style.height = `${window.innerHeight}px`;
    }
}

// 2. Aplica a altura assim que a página carrega
setHeroHeight();

// 3. Atualiza a altura APENAS se a largura mudar (ex: rodar o telemóvel),
// bloqueando completamente o redimensionamento ao fazer scroll vertical.
window.addEventListener("resize", () => {
    if (window.innerWidth !== currentWidth) {
        currentWidth = window.innerWidth;
        setHeroHeight();
    }
});

// 1. Bloqueia os gestos de pinch (abrir/fechar 2 dedos) específicos do Safari iOS
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
document.addEventListener('gestureend', function (e) { e.preventDefault(); });

// 2. Bloqueia toques simultâneos com 2 ou mais dedos
document.addEventListener('touchstart', function (e) {
    if (e.touches.length > 1) {
        e.preventDefault();
    }
}, { passive: false });

// 3. Bloqueia o zoom por duplo toque rápido (double-tap)
let lastTouchEnd = 0;
document.addEventListener('touchend', function (e) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
        e.preventDefault();
    }
    lastTouchEnd = now;
}, false);

// ==========================================
// PREVENÇÃO DE ZOOM ACIDENTAL DA PÁGINA
// ==========================================

// 1. Evita o zoom da página via Trackpad (pinch-to-zoom) ou Ctrl + Roda do rato no Desktop
document.addEventListener('wheel', function(e) {
    if (e.ctrlKey) {
        e.preventDefault();
    }
}, { passive: false });

// 2. Evita o zoom nativo do viewport no Safari iOS ao fazer gesto de pinça na página
document.addEventListener('gesturestart', function(e) {
    e.preventDefault();
}, { passive: false });

document.addEventListener('gesturechange', function(e) {
    e.preventDefault();
}, { passive: false });

// 3. Evita zoom por multi-toque ao fazer scroll na página (mantém o zoom interno da modal intacto)
document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1 && !document.body.classList.contains('modal-open')) {
        e.preventDefault();
    }
}, { passive: false });

</script>
