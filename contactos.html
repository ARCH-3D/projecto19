<!-- WIDGET CONTACTO -->
<div class="contact-widget">
    <div class="contact-links">
        <a href="mailto:info.projecto19@gmail.com">
            <img src="img/icons/e-mail.svg" alt="" class="contact-link-icon" width="24" height="24">
            <span>Email</span>
        </a>
        <a href="https://wa.me/351934185719" target="_blank" rel="noopener noreferrer">
            <img src="img/icons/whatsapp.svg" alt="" class="contact-link-icon" width="24" height="24">
            <span>WhatsApp</span>
        </a>
    </div>
    <button class="contact-trigger" aria-label="Abrir contactos">
        <img src="img/icons/faleconnosco.svg" alt="" class="contact-icon" width="24" height="24">
        <span>Fale Connosco</span>
    </button>
</div>
<script>
const contactWidget = document.querySelector(".contact-widget");
const contactButton = document.querySelector(".contact-trigger");

contactButton.addEventListener("click", function(e){
    e.stopPropagation();
    contactWidget.classList.toggle("active");
});
contactWidget.addEventListener("click", function(e){
    e.stopPropagation();
});

const menu = document.getElementById("menu");
const menuToggle = document.querySelector(".menu-toggle");

function toggleMenu() {
    menu.classList.toggle("active");
}

document.addEventListener("click", function(e) {
    if (menu.classList.contains("active") && !menu.contains(e.target) && !menuToggle.contains(e.target)) {
        menu.classList.remove("active");
    }
    if (contactWidget.classList.contains("active") && !contactWidget.contains(e.target)) {
        contactWidget.classList.remove("active");
    }
});

document.querySelectorAll("#menu a").forEach(link => {
    link.addEventListener("click", () => {
        menu.classList.remove("active");
    });
});

window.addEventListener("scroll", () => {
    menu.classList.remove("active");
    contactWidget.classList.remove("active");
}, { passive: true });
</script>
